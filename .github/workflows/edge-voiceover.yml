name: Generate Dmitry voiceover

on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - scripts/generate-edge-voiceover.sh

permissions:
  contents: write

jobs:
  voiceover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts
      - run: chmod +x scripts/generate-edge-voiceover.sh && scripts/generate-edge-voiceover.sh
      - name: Commit generated speech
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add edge-audio
          git commit -m "Generate Dmitry Edge-TTS voiceover" || exit 0
          git push origin work
